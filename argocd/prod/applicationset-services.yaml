apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: recruitment-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/recruitment-organisation/recruitment-gitops.git
        revision: main
        files:
          - path: values/prod/applications/*.yaml
  template:
    metadata:
      name: '{{ .fullnameOverride }}'
      labels:
        app.kubernetes.io/part-of: recruitment
        app.kubernetes.io/component: service
    spec:
      project: recruitment
      source:
        repoURL: https://github.com/recruitment-organisation/recruitment-gitops.git
        targetRevision: main
        path: charts/application
        helm:
          releaseName: '{{ .fullnameOverride }}'
          valueFiles:
            - '../../values/prod/applications/{{ .path.filename }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: recruitment
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
