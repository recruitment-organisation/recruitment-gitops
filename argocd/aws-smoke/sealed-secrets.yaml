apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: recruitment-sealed-secrets-smoke
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: recruitment-smoke
  source:
    repoURL: https://github.com/recruitment-organisation/recruitment-gitops.git
    targetRevision: main
    path: secrets/aws-smoke
    directory:
      recurse: false
      include: "*-credentials.sealed.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: recruitment
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
