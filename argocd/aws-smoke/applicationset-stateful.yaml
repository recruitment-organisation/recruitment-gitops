apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: recruitment-stateful-smoke
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/recruitment-organisation/recruitment-gitops.git
        revision: main
        files:
          - path: values/aws-smoke/stateful/*.yaml
  template:
    metadata:
      name: '{{ .fullnameOverride }}'
      labels:
        app.kubernetes.io/part-of: recruitment-smoke
        app.kubernetes.io/component: stateful
    spec:
      project: recruitment-smoke
      source:
        repoURL: https://github.com/recruitment-organisation/recruitment-gitops.git
        targetRevision: main
        path: charts/stateful
        helm:
          releaseName: '{{ .fullnameOverride }}'
          valueFiles:
            - '../../values/aws-smoke/stateful/{{ .path.filename }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: recruitment
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
