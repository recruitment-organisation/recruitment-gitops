apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: recruitment-smoke
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: Recruitment platform workloads for the AWS EKS smoke environment.
  sourceRepos:
    - https://github.com/recruitment-organisation/recruitment-gitops.git
  destinations:
    - namespace: recruitment
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
