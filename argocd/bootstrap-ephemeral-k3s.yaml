apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: recruitment-platform-ephemeral-k3s
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/recruitment-organisation/recruitment-gitops.git
    targetRevision: main
    path: argocd/local
    directory:
      recurse: true
      exclude: sealed-secrets.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

