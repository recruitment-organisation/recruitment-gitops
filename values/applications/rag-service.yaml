fullnameOverride: rag-service
replicas: 1
image:
  repository: ihab0/rag-service
  tag: "2.0.44"

container:
  port: 8094
service:
  enabled: true
  type: ClusterIP
  port: 8094
probes:
  path: /actuator/health
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 5
env:
  - name: SPRING_PROFILES_ACTIVE
    value: prod
  - name: CONFIG_SERVICE_URL
    value: http://config-service:9999
  - name: DISCOVERY_SERVICE_URL
    value: http://discovery-service:8761/eureka
  - name: KEYCLOAK_SERVER_URL
    value: http://keycloak-service:8080
  - name: KEYCLOAK_REALM
    value: micro-service
  - name: DB_URL
    value: jdbc:postgresql://rag-service-db:5432/rag_db
  - name: MINIO_URL
    value: http://minio:9000
secretEnv: []
existingSecret: rag-service-credentials
existingSecretEnv:
  - name: MINIO_ACCESS_KEY
    key: MINIO_ACCES_KEY
serviceAccount:
  create: true
  automount: false
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 65
podDisruptionBudget:
  enabled: true
  minAvailable: 1
