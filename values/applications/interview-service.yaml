fullnameOverride: interview-service
replicas: 1
image:
  repository: ihab0/interview-service
  tag: "3.0.1"
container:
  port: 8098
service:
  enabled: true
  type: ClusterIP
  port: 8098
probes:
  path: /actuator/health
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 5
env:
  - name: SPRING_PROFILES_ACTIVE
    value: prod
  - name: CONFIG_SERVICE_URL
    value: http://config-service:9999
  - name: DISCOVERY_SERVICE_URL
    value: http://discovery-service:8761/eureka
  - name: KEYCLOAK_SERVER_URL
    value: http://keycloak-service:8080
  - name: KEYCLOAK_REALM
    value: micro-service
  - name: INTERVIEW_DB_URL
    value: jdbc:postgresql://recruitment-db:5432/interview_db
secretEnv: []
existingSecret: interview-service-credentials
serviceAccount:
  create: true
  automount: false
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 65
podDisruptionBudget:
  enabled: true
  minAvailable: 1
