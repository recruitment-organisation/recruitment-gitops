fullnameOverride: gateway-service
replicas: 1
image:
  repository: ihab0/gateway-service
  tag: "3.0.2"
container:
  port: 8877
service:
  port: 8877
probes:
  path: /actuator/health
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 5
env:
  - name: CONFIG_SERVICE_URL
    value: http://config-service:9999
  - name: DISCOVERY_SERVICE_URL
    value: http://discovery-service:8761/eureka
  - name: KEYCLOAK_SERVER_URL
    value: http://keycloak-service:8080
  - name: KEYCLOAK_ISSUER_URI
    value: http://keycloak.localhost
  - name: KEYCLOAK_REALM
    value: micro-service
serviceAccount:
  create: true
  automount: false
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 65
podDisruptionBudget:
  enabled: true
  minAvailable: 1
