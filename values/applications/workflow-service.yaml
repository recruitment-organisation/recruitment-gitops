fullnameOverride: workflow-service
replicas: 2
image:
  repository: ihab0/workflow-service
  tag: "2.0.42"
container:
  port: 8099
service:
  enabled: true
  type: ClusterIP
  port: 8099
probes:
  path: /actuator/health
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 5
env:
  - name: SPRING_PROFILES_ACTIVE
    value: prod
  - name: CONFIG_SERVICE_URL
    value: http://config-service:9999
  - name: DISCOVERY_SERVICE_URL
    value: http://discovery-service:8761/eureka
  - name: KEYCLOAK_SERVER_URL
    value: http://keycloak-service:8080
  - name: KEYCLOAK_REALM
    value: micro-service
  - name: FLOWABLE_DB_URL
    value: jdbc:postgresql://flowable-service-db:5432/workflow_db
secretEnv: []
existingSecret: workflow-service-credentials
serviceAccount:
  create: true
  automount: false
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65
podDisruptionBudget:
  enabled: true
  minAvailable: 2
