fullnameOverride: frontend
replicas: 1
image:
  repository: ihab0/frontend
  tag: "4.0.0"
container:
  port: 80
service:
  enabled: true
  type: ClusterIP
  port: 80
probes:
  path: /
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3
serviceAccount:
  create: true
  automount: false
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: app.localhost
      paths:
        - path: /
          pathType: Prefix
