fullnameOverride: frontend
replicas: 2
image:
  repository: ihab0/frontend
  tag: "2.0.2"
container:
  port: 80
service:
  enabled: true
  type: ClusterIP
  port: 80
probes:
  path: /
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3
serviceAccount:
  create: true
  automount: false
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
ingress:
  enabled: true
  className: nginx
  hosts:
    - paths:
        - path: /
          pathType: Prefix
