fullnameOverride: config-service
replicas: 1
image:
  repository: ihab0/config-service
  tag: "2.0.2"
container:
  port: 9999
service:
  port: 9999
probes:
  path: /actuator/health
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 5
env:
  - name: CONFIG_REPOS
    value: https://github.com/IhabChouaibi/recruitment-config.git
  - name: DISCOVERY_SERVICE_URL
    value: http://discovery-service:8761/eureka
serviceAccount:
  create: true
  automount: false
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 65
podDisruptionBudget:
  enabled: true
  minAvailable: 1
