fullnameOverride: notification-service
replicas: 1
image:
  repository: ihab0/notification-service
  tag: "3.0.0"
container:
  port: 8093
service:
  enabled: true
  type: ClusterIP
  port: 8093
probes:
  path: /actuator/health
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 5
env:
  - name: SPRING_PROFILES_ACTIVE
    value: prod
  - name: DB_URL
    value: jdbc:postgresql://recruitment-db:5432/notification_db
  - name: CONFIG_SERVICE_URL
    value: http://config-service:9999
  - name: DISCOVERY_SERVICE_URL
    value: http://discovery-service:8761/eureka
  - name: KEYCLOAK_SERVER_URL
    value: http://keycloak-service:8080
  - name: KEYCLOAK_ISSUER_URI
    value: http://keycloak.localhost

  - name: KEYCLOAK_REALM
    value: micro-service
  - name: KAFKA_BOOTSTRAP_SERVERS
    value: kafka:9092
secretEnv: []
existingSecret: notification-service-credentials
serviceAccount:
  create: true
  automount: false
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 65
podDisruptionBudget:
  enabled: true
  minAvailable: 1
