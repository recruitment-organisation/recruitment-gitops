fullnameOverride: employee-service
replicas: 2
image:
  repository: ihab0/employee-service
  tag: "4.0.0"
container:
  port: 8095
service:
  enabled: true
  type: ClusterIP
  port: 8095
probes:
  path: /actuator/health
  initialDelaySeconds: 45
  periodSeconds: 10
  failureThreshold: 5
env:
  - name: SPRING_PROFILES_ACTIVE
    value: prod
  - name: CONFIG_SERVICE_URL
    value: http://config-service:9999
  - name: DISCOVERY_SERVICE_URL
    value: http://discovery-service:8761/eureka
  - name: KEYCLOAK_SERVER_URL
    value: http://keycloak-service:8080
  - name: KEYCLOAK_ISSUER_URI
    value: http://keycloak.localhost
  - name: KEYCLOAK_REALM
    value: micro-service
  - name: EMPLOYEE_DB_URL
    value: jdbc:postgresql://recruitment-db:5432/employee_db
secretEnv: []
existingSecret: employee-service-credentials
serviceAccount:
  create: true
  automount: false
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 65
podDisruptionBudget:
  enabled: true
  minAvailable: 1
