fullnameOverride: auth-service
replicas: 1
image:
  repository: ihab0/auth-service
  tag: "4.0.2"
container:
  port: 8092
service:
  enabled: true
  type: ClusterIP
  port: 8092
probes:
  enabled: true
  
env:
  - name: SPRING_PROFILES_ACTIVE
    value: kube
  - name: CONFIG_SERVICE_URL
    value: http://config-service:9999
  - name: DISCOVERY_SERVICE_URL
    value: http://discovery-service:8761/eureka
  - name: KEYCLOAK_SERVER_URL
    value: http://keycloak-service:8080
  - name: KEYCLOAK_ISSUER_URI
    value: http://keycloak.localhost
  - name: KEYCLOAK_REALM
    value: micro-service
  - name: KEYCLOAK_CLIENT_ID
    value: spring-service
  - name: KEYCLOAK_ADMIN_USER
    value: admin
secretEnv: []
existingSecret: auth-service-credentials
serviceAccount:
  create: true


  automount: false
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 65
podDisruptionBudget:
  enabled: true
  minAvailable: 1
