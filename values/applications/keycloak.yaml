fullnameOverride: keycloak-service

replicas: 1

image:
  repository: quay.io/keycloak/keycloak
  tag: "25.0.1"

container:
  port: 8080

command:
  - /opt/keycloak/bin/kc.sh
  - start
  - --http-enabled=true
  - --http-port=8080
  - --import-realm

service:
  enabled: true
  type: ClusterIP
  port: 8080

probes:
  enabled: true

  startup:
    path: /health/ready
    initialDelaySeconds: 20
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

  readiness:
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  liveness:
    path: /health/live
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3

env:
  - name: KC_DB
    value: postgres
  - name: KC_DB_URL_HOST
    value: recruitment-db
  - name: KC_DB_URL_DATABASE
    value: keycloak_db
  - name: KC_DB_URL_PORT
    value: "5432"
  - name: KC_HTTP_ENABLED
    value: "true"
  - name: KC_HEALTH_ENABLED
    value: "true"
  - name: KC_LEGACY_OBSERVABILITY_INTERFACE
    value: "true"
  - name: KC_HOSTNAME
    value: "http://keycloak.localhost"
  - name: KC_HOSTNAME_STRICT
    value: "false"
  - name: KC_PROXY_HEADERS
    value: xforwarded
secretEnv: []
existingSecret: keycloak-service-credentials

realmConfig:
  fileName: realm-microservice.json
  sourceFile: files/realm-microservice.json
serviceAccount:
  create: true
  automount: false

autoscaling:
  enabled: false

  minReplicas: 1
  maxReplicas: 4

  targetCPUUtilizationPercentage: 65

podDisruptionBudget:
  enabled: false

  minAvailable: 1

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
    nginx.ingress.kubernetes.io/proxy-redirect-from: http://keycloak-service
    nginx.ingress.kubernetes.io/proxy-redirect-to: http://keycloak.localhost
  hosts:
    - host: keycloak.localhost
      paths:
        - path: /
          pathType: Prefix
