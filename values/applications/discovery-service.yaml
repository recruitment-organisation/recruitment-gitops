fullnameOverride: discovery-service
replicas: 1
image:
  repository: ihab0/discovery-service
  tag: "2.0.2"
container:
  port: 8761
service:
  port: 8761
probes:
  path: /actuator/health
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 5
serviceAccount:
  create: true
  automount: false
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 65
podDisruptionBudget:
  enabled: false