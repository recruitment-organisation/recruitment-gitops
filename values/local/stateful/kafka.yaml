fullnameOverride: kafka

replicas: 1

image:
  repository: apache/kafka
  tag: "4.3.1"
  pullPolicy: IfNotPresent

container:
  port: 9092
  portName: kafka
  ports:
    - name: kafka
      containerPort: 9092
    - name: controller
      containerPort: 29093

service:
  enabled: true
  publishNotReadyAddresses: true
  ports:
    - name: kafka
      port: 9092
    - name: controller
      port: 29093


configMap:
  enabled: true
  data:
    KAFKA_NODE_ID: "1"
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-0.kafka:29093
    KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:9092
    KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
    KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

secret:
  create: false

persistence:
  enabled: true
  mountPath: /tmp/kraft-combined-logs
  size: 1Gi
  storageClassName: ""
  accessModes:
    - ReadWriteOnce

podSecurityContext:
  fsGroup: 1000

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi

readinessProbe:
  tcpSocket:
    port: kafka
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

livenessProbe:
  tcpSocket:
    port: kafka
  initialDelaySeconds: 60
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3
serviceAccount:
  create: true
  automount: false
