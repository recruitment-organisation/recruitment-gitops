fullnameOverride: rag-service
replicas: 1
image:
  repository: ihab0/rag-service
  tag: "4.5.0"
container:
  port: 8094
service:
  enabled: true
  type: ClusterIP
  port: 8094
probes:
  enabled: true
env:
  - name: SPRING_PROFILES_ACTIVE
    value: kube
  - name: CONFIG_SERVICE_URL
    value: http://config-service:9999
  - name: DISCOVERY_SERVICE_URL
    value: http://discovery-service:8761/eureka
  - name: KEYCLOAK_SERVER_URL
    value: http://keycloak-service:8080
  - name: KEYCLOAK_ISSUER_URI
    value: https://auth.3-224-80-236.sslip.io
  - name: KEYCLOAK_REALM
    value: micro-service
  - name: DB_URL
    value: jdbc:postgresql://rag-service-db:5432/rag_db
  - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
    value: "5"
  - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
    value: "1"
  - name: MINIO_URL
    value: http://minio:9000
secretEnv: []
existingSecret: rag-service-credentials
existingSecretEnv:
  - name: MINIO_ACCESS_KEY
    key: MINIO_ACCES_KEY
serviceAccount:
  create: true
  automount: false
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop:
      - ALL
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 65
podDisruptionBudget:
  enabled: false
  minAvailable: 1
