fullnameOverride: job-offer-service
replicas: 1
image:
  repository: ihab0/job-offer-service
  tag: "4.5.0"
container:
  port: 8096
service:
  enabled: true
  type: ClusterIP
  port: 8096
probes:
  enabled: true
env:
  - name: SPRING_PROFILES_ACTIVE
    value: kube
  - name: CONFIG_SERVICE_URL
    value: http://config-service:9999
  - name: DISCOVERY_SERVICE_URL
    value: http://discovery-service:8761/eureka
  - name: KEYCLOAK_SERVER_URL
    value: http://keycloak-service:8080
  - name: KEYCLOAK_ISSUER_URI
    value: https://auth.3-224-80-236.sslip.io
  - name: KEYCLOAK_REALM
    value: micro-service
  - name: JOB_OFFER_DB_URL
    value: jdbc:postgresql://recruitment-db:5432/job_offer_db
  - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
    value: "5"
  - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
    value: "1"
  - name: KAFKA_BOOTSTRAP_SERVERS
    value: kafka:9092
secretEnv: []
existingSecret: job-offer-service-credentials
serviceAccount:
  create: true
  automount: false
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop:
      - ALL
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 2
  targetCPUUtilizationPercentage: 65
podDisruptionBudget:
  enabled: false
  minAvailable: 1
