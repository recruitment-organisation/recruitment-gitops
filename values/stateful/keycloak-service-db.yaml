fullnameOverride: keycloak-service-db

replicas: 1

image:
  repository: postgres
  tag: "16-alpine"
  pullPolicy: IfNotPresent

container:
  port: 5432
  portName: postgres
  mountPath: /var/lib/postgresql/data

service:
  enabled: true
  port: 5432

configMap:
  enabled: true

  data:
    POSTGRES_DB: keycloakdb
    PGDATA: /var/lib/postgresql/data/pgdata

secret:
  create: false
  existingSecret: keycloak-service-credentials
  data: {}
  env:
    - name: POSTGRES_USER
      key: KC_DB_USERNAME
    - name: POSTGRES_PASSWORD
      key: KC_DB_PASSWORD

persistence:
  enabled: true
  size: 10Gi
  storageClassName: ""

  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 100m
    memory: 256Mi

  limits:
    cpu: 500m
    memory: 1Gi
serviceAccount:
  create: true
  automount: false
