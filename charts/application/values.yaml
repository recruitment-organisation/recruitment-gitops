fullnameOverride: ""

replicas: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

container:
  port: null

service:
  enabled: true
  type: ClusterIP

  port: null

env: []
secretEnv: []
existingSecret: ""
existingSecretEnv: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

probes:
  enabled: true

  startup:
    path: /actuator/health
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

serviceAccount:
  create: true

  name: ""

  automount: false

  annotations: {}
autoscaling:
  enabled: false

  minReplicas: 2
  maxReplicas: 5

  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false

  minAvailable: 1

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
