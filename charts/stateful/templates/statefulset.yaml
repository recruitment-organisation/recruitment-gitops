apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "stateful.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stateful.labels" . | nindent 4 }}

spec:
  serviceName: {{ include "stateful.fullname" . }}
  replicas: {{ .Values.replicas }}

  selector:
    matchLabels:
      {{- include "stateful.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "stateful.selectorLabels" . | nindent 8 }}

    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "stateful.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      containers:
        - name: {{ include "stateful.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.container.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.container.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          ports:
            {{- if .Values.container.ports }}
            {{- range .Values.container.ports }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
              protocol: {{ .protocol | default "TCP" }}
            {{- end }}
            {{- else }}
            - name: {{ .Values.container.portName | default "tcp" }}
              containerPort: {{ .Values.container.port }}
              protocol: TCP
            {{- end }}

          {{- if or .Values.configMap.enabled (and (or .Values.secret.create .Values.secret.existingSecret) (not .Values.secret.env)) }}
          envFrom:
            {{- if .Values.configMap.enabled }}
            - configMapRef:
                name: {{ include "stateful.configMapName" . }}
            {{- end }}

            {{- if or .Values.secret.create .Values.secret.existingSecret }}
            - secretRef:
                name: {{ include "stateful.secretName" . }}
            {{- end }}
          {{- end }}

          {{- with .Values.secret.env }}
          env:
            {{- range . }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "stateful.secretName" $ }}
                  key: {{ .key }}
            {{- end }}
          {{- end }}

          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath | default .Values.container.mountPath | required "persistence.mountPath est obligatoire" }}
          {{- end }}

          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- else }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.container.portName | default "tcp" }}
            initialDelaySeconds: 10
            periodSeconds: 5
          {{- end }}

          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- else }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.container.portName | default "tcp" }}
            initialDelaySeconds: 30
            periodSeconds: 10
          {{- end }}

  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "stateful.labels" . | nindent 10 }}

      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}

        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        {{- end }}

        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
